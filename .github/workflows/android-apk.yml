name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & Accept All Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || true
          fi

      - name: Install Gradle 9.3.1 (Non-root /tmp)
        run: |
          chmod +x gradlew || true
          curl -sL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o "$RUNNER_TEMP/gradle-9.3.1-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-9.3.1-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Prepare Signing Keystores & .env File
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            cp debug.keystore my-upload-key.jks
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Build Installable Debug APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run Unit & Robolectric Tests
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Prepare Branded APK Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/zip-unlocker-android-v1.0-debug.apk
          ls -lh dist/zip-unlocker-android-v1.0-debug.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip-unlocker-android-apk
          path: dist/zip-unlocker-android-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zip-unlocker-android-v1.0-debug.apk
          generate_release_notes: true
