name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || true

      - name: Install Gradle 9.3.1
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle-9.3.1-bin.zip -d /opt/
          echo "/opt/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Prepare Keystores & .env File
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            cp debug.keystore my-upload-key.jks
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Build Installable Debug APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Run Unit & Robolectric Tests
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Prepare Branded APK Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/zip-unlocker-android-v1.0-debug.apk
          ls -lh dist/zip-unlocker-android-v1.0-debug.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip-unlocker-android-apk
          path: dist/zip-unlocker-android-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zip-unlocker-android-v1.0-debug.apk
          generate_release_notes: true
